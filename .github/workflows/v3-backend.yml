name: v3 release safety checks

on:
  push:
    paths:
      - 'v3/**'
      - 'docs/**'
      - 'api/**'
      - 'vercel.json'
      - '.github/workflows/v3-backend.yml'
  pull_request:
    paths:
      - 'v3/**'
      - 'docs/**'
      - 'api/**'
      - 'vercel.json'
      - '.github/workflows/v3-backend.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v3/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run app:release-check
